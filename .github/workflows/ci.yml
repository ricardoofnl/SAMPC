name: CI

# manual only, nothing here runs on push
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'What to build'
        type: choice
        default: all
        options:
          - all
          - server-linux
          - server-windows

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-linux:
    name: Server (linux x86)
    if: inputs.targets == 'all' || inputs.targets == 'server-linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the network structs and the plugin ABI are 32 bit, see server/Makefile
      - name: Install 32 bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      # guards set explicitly, not left to whatever the distro gcc spec injects
      - name: Build server
        run: make -C server -j"$(nproc)" OPT="-O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong"

      - name: Build announce
        run: make -C announce -j"$(nproc)"

      - name: Smoke test
        run: |
          set -eu
          work=$(mktemp -d)
          cp server/mpsvr "$work/"
          cd "$work"
          mkdir -p gamemodes filterscripts scriptfiles
          cat > server.cfg <<'EOF'
          lanmode 1
          port 17777
          bind 127.0.0.1
          announce 0
          query 0
          rcon_password citest
          EOF
          # stderr is kept, an abort message from the hardening guards only ever
          # shows up there
          set +e
          timeout 15 ./mpsvr > run.out 2> run.err
          rc=$?
          set -e
          echo "--- exit code: $rc ---"
          echo '--- stderr ---'; cat run.err
          echo '--- server_log.txt ---'; cat server_log.txt

          # 124 is the timeout killing a healthy server, anything at or above 128
          # is a signal, which means it crashed
          if [ "$rc" -ge 128 ]; then
            echo "server died on signal $((rc - 128))"
            exit 1
          fi
          [ ! -s run.err ] || { echo "server wrote to stderr"; exit 1; }

          # with no gamemode0 it has to start, read the config, then bail out
          # with this exact complaint
          grep -q 'SA-MP Dedicated Server' server_log.txt
          grep -q 'It needs a gamemode0 line' server_log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: |
            server/mpsvr
            announce/announce
          if-no-files-found: error

  server-windows:
    name: Server (windows x86)
    if: inputs.targets == 'all' || inputs.targets == 'server-windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Build server
        run: msbuild server/server.sln /p:Configuration=Release /p:Platform=x86 /m /v:minimal

      - name: Build announce
        run: msbuild announce/announce.sln /p:Configuration=Release /p:Platform=x86 /m /v:minimal

      - name: Collect
        shell: bash
        run: |
          set -eu
          mkdir -p out
          # Win32 projects land in <project dir>/Release, but do not guess silently
          grab() {
            local name=$1 root=$2 required=$3 hit
            hit=$(find "$root" -name "$name" -type f -print -quit)
            if [ -n "$hit" ]; then
              cp "$hit" out/
              echo "collected $name from $hit"
            elif [ "$required" = required ]; then
              echo "could not find $name under $root, tree was:"
              find "$root" -name '*.exe' -o -name '*.dll' | head -40
              exit 1
            else
              echo "note, $name not produced"
            fi
          }
          grab server.exe   server   required
          grab announce.exe announce optional

      - uses: actions/upload-artifact@v4
        with:
          name: server-windows
          path: out/
          if-no-files-found: error
