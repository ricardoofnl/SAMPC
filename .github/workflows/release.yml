name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for this release, e.g. 0.3.9-A5. The tag becomes v<version>.'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        type: boolean
        default: true
      draft:
        description: 'Publish as a draft so you can review before it goes live'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-linux:
    name: Server (linux x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 32 bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - run: make -C server -j"$(nproc)"
      - run: make -C announce -j"$(nproc)"

      - name: Collect
        run: |
          mkdir -p out
          cp server/mpsvr out/
          cp announce/announce out/

      - uses: actions/upload-artifact@v4
        with:
          name: build-server-linux
          path: out/
          if-no-files-found: error

  build-windows:
    name: Server and client (windows x86)
    runs-on: windows-latest
    outputs:
      client_built: ${{ steps.collect.outputs.client_built }}
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Build server
        run: msbuild server/server.sln /p:Configuration=Release /p:Platform=x86 /m /v:minimal

      - name: Build announce
        continue-on-error: true
        run: msbuild announce/announce.sln /p:Configuration=Release /p:Platform=x86 /m /v:minimal

      # standalone tools, no client dependencies, so they ship regardless
      - name: Build tools
        run: |
          msbuild rcon/rcon.vcxproj /p:Configuration=Release /p:Platform=Win32 /v:minimal
          msbuild arctool2/arctool2.vcxproj /p:Configuration=Release /p:Platform=Win32 /v:minimal

      # see the client-windows job in ci.yml for why this is conditional
      - name: Check out client dependencies
        if: vars.CLIENT_DEPS_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CLIENT_DEPS_REPO }}
          token: ${{ secrets.CLIENT_DEPS_TOKEN }}
          path: deps

      - name: Place client dependencies
        if: vars.CLIENT_DEPS_REPO != ''
        shell: bash
        run: |
          set -eu
          cp deps/lib/x86/bass.lib    sdk/bass/bass.lib
          cp deps/lib/x86/detours.lib sdk/detours/detours.lib
          echo "DXSDK_DIR=$(pwd -W)/deps/" >> "$GITHUB_ENV"

      - name: Build client
        if: vars.CLIENT_DEPS_REPO != ''
        run: msbuild client/client.sln /p:Configuration=Release /p:Platform=x86 /m /v:minimal

      - name: Build debug launcher
        if: vars.CLIENT_DEPS_REPO != ''
        continue-on-error: true
        run: msbuild launch3/launch3.sln /p:Configuration=Release /p:Platform=x86 /m /v:minimal

      - name: Collect
        id: collect
        shell: bash
        run: |
          set -eu
          mkdir -p out-server out-client out-tools

          # Win32 projects land in <project dir>/Release, found rather than assumed
          find_one() { find "$2" -name "$1" -type f -print -quit; }

          srv=$(find_one server.exe server)
          if [ -z "$srv" ]; then
            echo "server.exe was not produced, tree was:"
            find server -name '*.exe' | head -40
            exit 1
          fi
          cp "$srv" out-server/

          ann=$(find_one announce.exe announce || true)
          [ -n "$ann" ] && cp "$ann" out-server/ || echo "note, announce.exe not produced"

          rc=$(find_one rcon.exe rcon)
          arc=$(find_one arctool2.exe arctool2)
          if [ -z "$rc" ] || [ -z "$arc" ]; then
            echo "a tool was not produced: rcon.exe='$rc' arctool2.exe='$arc'"
            exit 1
          fi
          cp "$rc" "$arc" out-tools/

          dll=$(find_one samp.dll client || true)
          if [ -n "$dll" ]; then
            cp "$dll" out-client/
            dbg=$(find_one samp_debug.exe launch3 || true)
            [ -n "$dbg" ] && cp "$dbg" out-client/ || true
            echo "client_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "client_built=false" >> "$GITHUB_OUTPUT"
            # keep the artifact upload happy
            echo "client was not built, see the release notes" > out-client/NOT_BUILT.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-server-windows
          path: out-server/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: build-tools-windows
          path: out-tools/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: build-client-windows
          path: out-client/
          if-no-files-found: error

  release:
    name: Package and publish
    runs-on: ubuntu-latest
    needs: [ build-linux, build-windows ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so the changelog can diff against the previous tag
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      # lets package.sh precompile gamemodes/bare.amx into the server zips. an
      # upstream release rather than a source build, the tree does not compile
      # cleanly on a modern host: pawnruns trips assert_static(sizeof(f) <=
      # sizeof(cell)) on x86_64, and its cmake_minimum_required predates 3.5
      - name: Install the Pawn compiler
        continue-on-error: true
        env:
          PAWNCC_VERSION: 3.10.10
        run: |
          set -eu
          # the upstream binary is 32 bit
          sudo apt-get install -y libc6-i386
          curl -fsSL -o /tmp/pawnc.tar.gz \
            "https://github.com/pawn-lang/compiler/releases/download/v$PAWNCC_VERSION/pawnc-$PAWNCC_VERSION-linux.tar.gz"
          sudo tar xzf /tmp/pawnc.tar.gz -C /usr/local --strip-components=1
          sudo ldconfig
          pawncc 2>&1 | head -2 || true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build the zips
        id: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir -p release
          dist/package.sh server-linux   "$VERSION" artifacts/build-server-linux   release
          dist/package.sh server-windows "$VERSION" artifacts/build-server-windows release
          dist/package.sh tools-windows  "$VERSION" artifacts/build-tools-windows  release
          if [ "${{ needs.build-windows.outputs.client_built }}" = "true" ]; then
            dist/package.sh client-windows "$VERSION" artifacts/build-client-windows release
          else
            echo "skipping the client zip, samp.dll was not built"
          fi
          ls -la release

      - name: Write the release notes
        env:
          VERSION: ${{ inputs.version }}
          CLIENT_BUILT: ${{ needs.build-windows.outputs.client_built }}
        run: |
          set -eu
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)

          {
            echo "SAMPC \`$VERSION\`, built from \`$(git rev-parse --short HEAD)\`."
            echo
            echo "\`SAMP_VERSION\` in \`sdk/shared.h\` is \`$(grep -oP '(?<=#define SAMP_VERSION ")[^"]+' sdk/shared.h)\`, \`NETGAME_VERSION\` is \`$(grep -oP '(?<=#define NETGAME_VERSION )\d+' sdk/shared.h)\`."
            echo

            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              echo "Since \`$prev\`:"
              echo
              git log --no-merges --pretty='- %s (`%h`)' "$prev..HEAD"
            else
              echo "First tagged release, full history:"
              echo
              git log --no-merges --pretty='- %s (`%h`)'
            fi
            echo

            echo "## Downloads"
            echo
            echo "- \`sampc-$VERSION-server-linux.zip\` 32 bit linux server, ready to run"
            echo "- \`sampc-$VERSION-server-windows.zip\` 32 bit windows server, ready to run"
            echo "- \`sampc-$VERSION-tools-windows.zip\` \`rcon.exe\` and \`arctool2.exe\`, standalone, no dependencies"
            if [ "$CLIENT_BUILT" = "true" ]; then
              echo "- \`sampc-$VERSION-client-windows.zip\` \`samp.dll\` for GTA:SA 1.0 US or EU"
            else
              echo "- no client zip in this release. \`samp.dll\` needs d3dx9 plus \`bass.lib\` and \`detours.lib\`, none of which can be redistributed here. Set the \`CLIENT_DEPS_REPO\` variable and the \`CLIENT_DEPS_TOKEN\` secret to enable the client build, see BUILDING.md."
            fi
            echo

            echo "Client and server from the same release have to be used together, the"
            echo "protocol is not compatible with stock SA-MP."
          } > notes.md

          echo '--- notes.md ---'
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          args=""
          [ "${{ inputs.prerelease }}" = "true" ] && args="$args --prerelease"
          [ "${{ inputs.draft }}" = "true" ] && args="$args --draft"

          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "SAMPC $VERSION" \
            --notes-file notes.md \
            $args \
            release/*.zip